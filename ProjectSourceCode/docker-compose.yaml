services:
  db:
    image: postgres:14
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - group-project:/var/lib/postgresql/data
      - ./src/init_data:/docker-entrypoint-initdb.d

  ai_service:
    build:
      context: ./src/wordpar_ai
    env_file: .env
    ports:
      - "5001:5000"
    volumes:
      - ./src/wordpar_ai:/app
    depends_on:
      - db

  web:
    image: node:lts
    user: 'node'
    working_dir: /repository
    env_file: .env
    environment:
      - NODE_ENV=development
    depends_on:
      - db
      - ai_service
    ports:
      - '3000:3000'
    volumes:
      - ./:/repository
    command: 'npm start'

volumes:
  group-project: